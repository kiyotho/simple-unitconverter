<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div id="container">
            <div id="head">
                <p id="title">Metric/Imperial Unit Conversion</p>
                <input type="number" id="input">
                <button id="convert-btn">Convert</button>
                <div id="err"></div>
            </div>

            <div id="below-head">

                <div class="info-box">
                    <p class="title-unit">Length (Meter/Feet)</p>
                    <p id="value-len">0 meters = 0 feet | 0 feet = 0 meters</p>
                </div>

                <div class="info-box">
                    <p class="title-unit">Volume (Liters/Gallons)</p>
                    <p id="value-vol">0 liters = 0 gallons | 0 gallons = 0 liters</p>
                </div>
                
                
                <div class="info-box">
                    <p class="title-unit">Mass (Kilograms/Pounds)</p>
                    <p id="value-mass">0 kilos = 0 pounds | 0 pounds = 0 kilos</p>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
    </body>

</html>
